packages:
  - "."

overrides:
  devalue: ">=5.6.2"
  # undici 5.x has two high-severity WebSocket CVEs with no patched 5.x
  # release; the only consumer is the ai@5 subtree under @ai-sdk-tools/*.
  "undici@5": ">=6.28.0"

allowBuilds:
  "@nestjs/core": true
  "@sentry-internal/node-cpu-profiler": true
  "@sentry/cli": true
  "@sentry/node-cpu-profiler": true
  "@swc/core": true
  cbor-extract: true
  esbuild: true
  msw: true
  sharp: true
